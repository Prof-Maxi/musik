<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:LS;font-weight:500;src:url(__CD__/fonts/league-spartan-latin-500-normal.woff2)}
@font-face{font-family:LS;font-weight:600;src:url(__CD__/fonts/league-spartan-latin-600-normal.woff2)}
@font-face{font-family:LS;font-weight:700;src:url(__CD__/fonts/league-spartan-latin-700-normal.woff2)}
@font-face{font-family:LS;font-weight:800;src:url(__CD__/fonts/league-spartan-latin-800-normal.woff2)}
@font-face{font-family:IN;font-weight:400;src:url(file:///usr/share/fonts/opentype/inter/Inter-Regular.otf)}
@font-face{font-family:IN;font-weight:500;src:url(file:///usr/share/fonts/opentype/inter/Inter-Medium.otf)}
@font-face{font-family:IN;font-weight:700;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ZDF-Testsequenz im Corporate Design der Wahlplakate (siehe 01_corporate-design/CD-Tokens.md)
const T = __TIMELINE__;
const W=1920,H=1080,c=document.getElementById('c'),g=c.getContext('2d');
const NAVY='#132962',NAVY_DEEP='#0C1B45',GELB='#F9D648',ELEKTRO='#3230BC',SCHWARZ='#010005',PIXELBLAU='#2759B3',WEISS='#FFFFFF',INK='#0A0A1E';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lin=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eQuint=x=>1-Math.pow(1-x,5);
const eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eBack=x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const frames=[];let loaded=0;
window.READY=new Promise(res=>{for(let i=0;i<T.porsche_frames;i++){const im=new Image();im.onload=()=>{if(++loaded==T.porsche_frames)res()};
  im.src=T.porsche_dir+'/f'+String(i+1).padStart(4,'0')+'.jpg';frames.push(im)}});

// ---------- Elemente ----------
function gradientBG(t){ // Plakat 2: Schwarz -> Elektroblau, mit leichtem Atmen
  const lg=g.createLinearGradient(0,0,W,0);lg.addColorStop(0,SCHWARZ);lg.addColorStop(0.55,'#1A1866');lg.addColorStop(1,ELEKTRO);
  g.fillStyle=lg;g.fillRect(0,0,W,H);
  const r=g.createRadialGradient(W*0.8,H*0.3+Math.sin(t*.5)*40,20,W*0.8,H*0.35,W*0.6);
  r.addColorStop(0,'rgba(90,90,255,0.22)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,W,H);
}
function navyBG(t){ // Plakat 1: Navy, mit Tiefe
  const r=g.createRadialGradient(W*0.5,H*0.42,40,W*0.5,H*0.5,W*0.8);
  r.addColorStop(0,'#1A3478');r.addColorStop(0.55,NAVY);r.addColorStop(1,NAVY_DEEP);g.fillStyle=r;g.fillRect(0,0,W,H);
}
function grid(alpha,off){g.save();g.globalAlpha=alpha;g.strokeStyle='rgba(150,170,255,0.13)';g.lineWidth=1;const s=96;
  for(let x=(off%s)-s;x<W+s;x+=s){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,H);g.stroke()}
  for(let y=0;y<H;y+=s){g.beginPath();g.moveTo(0,y+.5);g.lineTo(W,y+.5);g.stroke()}g.restore()}
function roundedPoly(pts,r){g.beginPath();const n=pts.length;
  const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];const s=m(pts[n-1],pts[0]);g.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];g.arcTo(p[0],p[1],q[0],q[1],r)}g.closePath()}
// gestufte Pixelformen aus Plakat 2 (Rastereinheiten)
const SHAPES={
  stairA:[[0,0],[3,0],[3,1],[4,1],[4,2],[1,2],[1,1],[0,1]],
  stairB:[[0,0],[1,0],[1,1],[2,1],[2,3],[1,3],[1,2],[0,2]],
  bar:[[0,0],[3,0],[3,1],[0,1]],
  hook:[[0,0],[2,0],[2,2],[3,2],[3,3],[1,3],[1,1],[0,1]]};
function pixel(shape,x,y,u,color,alpha=1){g.save();g.globalAlpha=alpha;g.translate(x,y);
  roundedPoly(SHAPES[shape].map(p=>[p[0]*u,p[1]*u]),u*0.16);g.fillStyle=color;g.fill();
  g.lineWidth=Math.max(2,u*0.04);g.strokeStyle=INK;g.stroke();g.restore()}
function pixelIn(shape,x,y,u,color,t,t0,dx,dy,dur=0.7){const p=eBack(lin(t,t0,t0+dur));if(p<=0)return;
  pixel(shape,x+dx*(1-p),y+dy*(1-p),u,color,clamp(p*2))}
function spaced(txt,x,y,track){let cx=x;for(const ch of txt){g.fillText(ch,cx,y);cx+=g.measureText(ch).width+track}return cx-x-track}
function spacedW(txt,track){let w=0;for(const ch of txt)w+=g.measureText(ch).width+track;return w-track}
function rise(txt,font,x,y,p,color,lh){g.save();g.font=font;const m=g.measureText(txt);
  g.beginPath();g.rect(x-20,y-lh*0.95,m.width+60,lh*1.3);g.clip();g.fillStyle=color;g.globalAlpha=clamp(p*3);
  g.fillText(txt,x,y+(1-eQuint(p))*lh*1.05);g.restore();return m.width}
function band(t,t0,y,h,dir=1,dur=0.55){ // gelbes Band über die volle Breite (Plakat 1)
  const p=eIO(lin(t,t0,t0+dur));if(p<=0)return 0;g.fillStyle=GELB;
  if(dir>0)g.fillRect(0,y,W*p,h);else g.fillRect(W*(1-p),y,W*p,h);return p}

// ---------- A: ernster Auftakt (Plakat 2) ----------
function secA(t){
  gradientBG(t);grid(0.35*lin(t,0,1.5),t*10);
  const z=1+0.03*lin(t,0,T.a_end);g.save();g.translate(W/2,H/2);g.scale(z,z);g.translate(-W/2,-H/2);
  pixelIn('stairA',W-330,70,62,GELB,t,0.2,260,0,1.1);
  pixelIn('stairB',W-200,250,62,PIXELBLAU,t,0.45,240,0,1.1);
  pixelIn('hook',-60,H-240,58,GELB,t,0.7,-220,0,1.1);
  g.font='500 36px IN';g.fillStyle=GELB;g.globalAlpha=eOut(lin(t,0.3,1.0));
  g.fillText('Gemeinsam für eine bessere digitale Zukunft',190,372);g.globalAlpha=1;
  let x=190;T.vo1_words.forEach((w,i)=>{if(i==3)x=190;const y=i<3?520:648;
    const p=lin(t,T.vo1_t+w.s-0.06,T.vo1_t+w.s+0.38);x+=rise(w.w,'700 124px LS',x,y,p,WEISS,128)+34});
  g.restore();
  const f=lin(t,T.a_end-0.12,T.a_end);if(f>0){g.fillStyle='rgba(0,0,0,'+f+')';g.fillRect(0,0,W,H)}
}
// ---------- C: Higgsfield-Aufnahme ----------
function footage(t){
  const i=clamp(Math.floor((t-T.drop)*30),0,T.porsche_frames-1);g.drawImage(frames[i],0,0,W,H);
  const fl=1-lin(t,T.drop,T.drop+0.18);if(fl>0){g.fillStyle='rgba(255,248,225,'+(0.5*fl)+')';g.fillRect(0,0,W,H)}
  const bar=138;g.fillStyle='#000';g.fillRect(0,0,W,bar);g.fillRect(0,H-bar,W,bar);
  const b=eOut(lin(t,T.drop+0.9,T.drop+1.4));if(b>0){g.save();g.globalAlpha=b;g.fillStyle=WEISS;g.font='700 46px LS';
    g.fillText('ZDF',W-96-g.measureText('ZDF').width,bar+80);g.fillStyle=GELB;g.fillRect(W-96-g.measureText('ZDF').width,bar+92,g.measureText('ZDF').width,6);g.restore()}
}
// ---------- D: Programmkarte (Plakat 1) ----------
function pixelWipe(t,t0){ // Pixelblöcke schieben sich von rechts über das Bild (digitaler Übergang)
  const u=120;let cover=0;
  for(let row=0;row<10;row++)for(let col=0;col<17;col++){
    const delay=(16-col)*0.022+((row*7)%5)*0.018;const p=eIO(lin(t,t0+delay,t0+delay+0.28));
    if(p<=0)continue;const s=u*p;const x=col*u+(u-s)/2,y=row*u+(u-s)/2;
    g.fillStyle=((col+row)%7==0)?GELB:((col*3+row)%5==0?PIXELBLAU:NAVY);g.fillRect(x-1,y-1,s+2,s+2);if(p>=1)cover++}
  return cover>=170;
}
function stockLine(t,t0,alpha){const p=eOut(lin(t,t0,t0+2.2));if(p<=0)return;g.save();g.globalAlpha=alpha;g.strokeStyle=GELB;g.lineWidth=3;g.beginPath();
  const N=140;for(let k=0;k<=N*p;k++){const u=k/N;const x=-40+u*(W+80);const y=H*0.9-Math.pow(u,3.2)*H*0.62-Math.sin(u*38)*14*(1-u)-Math.sin(u*91)*6;k?g.lineTo(x,y):g.moveTo(x,y)}
  g.stroke();g.restore()}
function secD(t){
  const t0=T.card_in;
  const covered = t>t0+0.75;
  if(!covered){footage(t);pixelWipe(t,t0-0.05);return}
  navyBG(t);grid(0.3,t*16);stockLine(t,t0+0.6,0.4);
  pixel('stairA',W-300+Math.sin(t)*4,120,56,GELB,0.95);pixel('stairB',W-170,300,56,PIXELBLAU,0.95);
  // Kategorie als gelbes Band-Etikett mit schwarzer Schrift
  const k=eExpo(lin(t,t0+0.75,t0+1.15));g.fillStyle=GELB;g.font='700 40px LS';const kw=spacedW('MOBILITÄT',4);
  g.fillRect(190,330,(kw+56)*k,64);if(k>0.6){g.fillStyle='#000';g.globalAlpha=lin(k,0.6,1);spaced('MOBILITÄT',218,376,4);g.globalAlpha=1}
  let x=190;['Porsche','für','alle.'].forEach((w,i)=>{const p=lin(t,t0+0.85+i*0.09,t0+1.35+i*0.09);x+=rise(w,'800 176px LS',x,590,p,WEISS,180)+40});
  rise('*','800 130px LS',x-36,548,lin(t,t0+1.2,t0+1.5),GELB,140);
  const pf=eOut(lin(t,T.footnote,T.footnote+0.5));g.save();g.globalAlpha=pf*0.85;g.fillStyle=WEISS;g.font='400 36px IN';
  g.fillText('*Bonität vorausgesetzt.',196,690+(1-pf)*10);g.restore();
}
// ---------- E: Logo-Finale (Plakat 1) ----------
function secE(t){
  const t0=T.logo_in;const sw=eIO(lin(t,t0-0.05,t0+0.42));const sk=380;const xr=-sk+(W+2*sk+200)*sw;
  if(sw<1){secD(t)}
  g.save();g.beginPath();g.moveTo(-sk,0);g.lineTo(xr,0);g.lineTo(xr-sk,H);g.lineTo(-sk,H);g.closePath();g.clip();
  navyBG(t);grid(0.22,t*6);
  // Pixelblöcke fliegen aus den Ecken ein
  pixelIn('stairA',W-360,40,64,GELB,t,t0+0.05,300,-120,0.8);
  pixelIn('stairB',W-210,230,64,PIXELBLAU,t,t0+0.15,300,0,0.8);
  pixelIn('hook',-70,H-250,60,GELB,t,t0+0.1,-260,80,0.8);
  // Wortmarke
  const cx=W/2;g.font='700 330px LS';const word='ZDF';const tw=g.measureText(word).width;let x=cx-tw/2;const y=440;
  [...word].forEach((ch,i)=>{const q=lin(t,t0+0.12+i*0.07,t0+0.62+i*0.07);const cw=g.measureText(ch).width;g.save();g.beginPath();g.rect(x-10,y-280,cw+20,330);g.clip();
    g.fillStyle=WEISS;g.fillText(ch,x,y+(1-eQuint(q))*320);g.restore();x+=cw});
  const pn=eOut(lin(t,t0+0.55,t0+0.95));g.globalAlpha=pn;g.fillStyle=WEISS;g.font='600 64px LS';
  ['Zukunftsbündnis','Digitaler Fortschritt'].forEach((l,i)=>{const lw=g.measureText(l).width;g.fillText(l,cx-lw/2,y+92+i*70+(1-pn)*14)});g.globalAlpha=1;
  // gelbes Band mit schwarzem Claim
  const bp=band(t,t0+0.8,y+190,150,1,0.5);
  if(bp>0.5){const pc=eOut(lin(t,t0+1.05,t0+1.45));g.save();g.beginPath();g.rect(0,y+190,W*bp,150);g.clip();g.fillStyle='#000';g.font='700 84px LS';
    const cl='Digital denken. Zukunft lenken.';const cw=g.measureText(cl).width;g.fillText(cl,cx-cw/2,y+292+(1-pc)*60);g.restore()}
  // Absender + Satirehinweis
  const pa=eOut(lin(t,t0+1.3,t0+1.7));g.globalAlpha=pa;g.fillStyle=WEISS;g.font='700 30px LS';
  const ab='ZDF – Für Fortschritt und Freiheit';g.fillText(ab,W-110-g.measureText(ab).width,H-64);
  g.globalAlpha=0.6*pa;g.font='400 22px IN';const dsc='Satire · Fiktive Schulpartei · Sozialkundeprojekt';g.fillText(dsc,cx-g.measureText(dsc).width/2,H-26);g.globalAlpha=1;
  g.restore();
  // gelbe Wischkante (Plakat-Band als Übergang)
  if(sw>0&&sw<1){g.fillStyle=GELB;g.beginPath();g.moveTo(xr,0);g.lineTo(xr+200,0);g.lineTo(xr+200-sk,H);g.lineTo(xr-sk,H);g.closePath();g.fill()}
}
window.render=function(t){
  g.globalAlpha=1;g.textBaseline='alphabetic';g.fillStyle='#000';g.fillRect(0,0,W,H);
  if(t<T.a_end)secA(t);else if(t<T.drop){}else if(t<T.card_in-0.05)footage(t);else if(t<T.logo_in)secD(t);else secE(t);
  const fo=lin(t,T.total-0.35,T.total);if(fo>0){g.globalAlpha=1;g.fillStyle='rgba(0,0,0,'+fo+')';g.fillRect(0,0,W,H)}
};
</script></body></html>
